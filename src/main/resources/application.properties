# ===================== Basic Project Configuration =====================
# SpringBoot application identification name (consistent with project name)
spring.application.name=News_Course_Design



# ===================== MySQL Database Configuration =====================
# MySQL driver class (Must use com.mysql.cj.jdbc.Driver for MySQL 8.0+, com.mysql.jdbc.Driver for 5.7-)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Database connection URL:
# localhost:3306 = MySQL server address and port (default 3306)
# news_course_design = Database name (Buyer must create this database first)
# useUnicode=true&characterEncoding=utf8 = Solve Chinese garbled code
# serverTimezone=Asia/Shanghai = Time zone configuration (required, avoid time zone errors)
spring.datasource.url=jdbc:mysql://localhost:3306/news_course_design?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# MySQL login username (Buyer need to modify to their own MySQL username, default is root)
spring.datasource.username=root
# MySQL login password (Buyer need to modify to their own MySQL password, default is 123456)
spring.datasource.password=123456



# ===================== File Upload Configuration =====================
# Maximum size of a single uploaded file (2MB here, adjust as needed)
spring.servlet.multipart.max-file-size=2MB
# Maximum total size of all files for a single request (10MB here)
spring.servlet.multipart.max-request-size=10MB
# Enable file upload function (Must be true, otherwise upload will fail)
spring.servlet.multipart.enabled=true



# ===================== MyBatis Configuration =====================
# Specify the location of MyBatis Mapper XML files (all .xml files in resources/mapper directory)
mybatis.mapper-locations=classpath:mapper/*.xml
# Entity class alias package path (Use entity class name directly in Mapper.xml without full class name)
mybatis.type-aliases-package=com.guat.mynewsapp.entity
# Enable SQL log printing (DEBUG level, show executed SQL in console for debugging)
logging.level.com.example.mapper=DEBUG
# Enable underscore to camel case automatic mapping (e.g. user_name -> userName)
mybatis.configuration.map-underscore-to-camel-case=true
# Specify MyBatis log implementation class (Print SQL in console for troubleshooting)
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl



# ===================== Static Resource Configuration =====================
# Static resource access paths:
# classpath:/static/ = Default static resource directory (css/js/img etc.)
# file:./uploads/ = Local uploads folder (Uploaded files can be accessed directly)
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
# Enable static resource chain (Optimize static resource loading, recommended but not required)
spring.web.resources.chain.enabled=true



# ===================== Custom File Path Configuration =====================
# Root directory for file uploads (uploads folder in project root directory)
file.upload-dir=./uploads
# Specific upload path for news images (uploads/news_images under resources, adjust as needed)
news.upload.path=src/main/resources/uploads/news_images/



# ===================== SpringDoc API Documentation Configuration =====================
# Enable API documentation generation (For auto-generating API docs, non-core config)
springdoc.api-docs.enabled=true
# API documentation access path (Buyer can view JSON via http://localhost:8080/v3/api-docs)
springdoc.api-docs.path=/v3/api-docs
# Disable Schema property resolution (Reduce document redundancy)
springdoc.api-docs.resolve-schema-properties=false
# Disable SpringSecurity integration (Required if no security framework, avoid errors)
springdoc.api-docs.enable-spring-security=false
# Disable Hateoas integration (Required if no related dependencies, avoid errors)
springdoc.api-docs.enable-hateoas=false
# Specify Controller package path for API documentation scanning
springdoc.packages-to-scan=com.guat.mynewsapp.controller
